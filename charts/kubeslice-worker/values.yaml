operator:
  image:  harbor.saas1.smart-scaler.io/avesha/aveshasystems/worker-operator
  pullPolicy: IfNotPresent
  logLevel: INFO
  tag: 1.5.0

rbacproxy:
  image: gcr.io/kubebuilder/kube-rbac-proxy
  tag: v0.16.0

## Base64 encoded secret values from controller cluster
controllerSecret:
  namespace:
  endpoint:
  ca.crt:
  token:

cluster:
  name:
  nodeIp: # This field is deprecated. You can set nodeIPs through cluster spec.
  endpoint:

router:
  image: docker.io/aveshasystems/cmd-nse-vl3
  tag: 1.0.7
  pullPolicy: IfNotPresent                                                                                     

routerSidecar:
  image: harbor.saas1.smart-scaler.io/avesha/aveshasystems/kubeslice-router-sidecar
  tag: 1.4.6
  pullPolicy: IfNotPresent


gateway:
  image: harbor.saas1.smart-scaler.io/avesha/aveshasystems/gw-sidecar
  tag: 1.1.1
  pullPolicy: IfNotPresent
  logLevel: INFO

gatewayEdge:
  image: harbor.saas1.smart-scaler.io/avesha/aveshasystems/slicegw-edge
  tag: 1.0.6

openvpn:
  server:
    image: harbor.saas1.smart-scaler.io/avesha/aveshasystems/openvpn-server.alpine
    tag: 1.0.4
    pullPolicy: IfNotPresent
  client:
    image: harbor.saas1.smart-scaler.io/avesha/aveshasystems/openvpn-client.alpine
    tag: 1.0.4
    pullPolicy: IfNotPresent

dns:
  image: harbor.saas1.smart-scaler.io/avesha/aveshasystems/dns
  tag: 0.1.5
  pullPolicy: IfNotPresent

workerInstaller:
  image: harbor.saas1.smart-scaler.io/avesha/aveshasystems/worker-installer
  tag: 1.8.1

# kubectl image for jobs
kubectlImage: alpine-k8s
kubectlImageTag: "1.0.1"

jaeger:
  enabled: false

events:
  disabled: true

imagePullSecrets: []

# change ths value for intracluster where controller cluster is in same cluster as worker as is different from default
controllerNamespace: kubeslice-controller

global:
  imageRegistry: harbor.saas1.smart-scaler.io/avesha/aveshasystems
  profile:
    openshift: false

# enable/disable network component installation
kubesliceNetworking:
  enabled: true

nsm:
  spire:
    priorityClassName: ""
    spire-server:
      priorityClassName: ""
    spiffe-csi-driver:
      priorityClassName: ""
