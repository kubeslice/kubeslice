global:
  netop_docker_existingImagePullSecret: "kubeslice-image-pull-secret"
  # IF You dont have existing secret then pass all below values it will create new secret "avesha-docker-ips"
  ## MANDOTORY FIELDS IF EXISTING SECRET NOT PRESENT ##
  netop_docker_imagePullSecrets:
    repository: 
    username: ''
    password: ''
    email: ''
  imageRegistry: docker.io/aveshasystems

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "kubeslice-netop"

netop:
  networkInterface: eth0
  image: netops
  tag: 0.2.2 
  pullPolicy: IfNotPresent
