name: Release Helm Charts

on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      cert-manager:
        type: choice
        # Friendly description to be shown in the UI instead of 'cert-manager'
        description: 'Release cert-manager Helm Chart'
        # Default value if no value is explicitly provided
        default: 'No'
        # Input has to be provided for the workflow to run
        required: true
        options:
        - 'Yes'
        - 'No'
      istio-base:
        type: choice
        # Friendly description to be shown in the UI instead of 'istio-base'
        description: 'Release istio-base Helm Chart'
        # Default value if no value is explicitly provided
        default: 'No'
        # Input has to be provided for the workflow to run
        required: true
        options:
        - 'Yes'
        - 'No'
      istio-discovery:
        type: choice
        # Friendly description to be shown in the UI instead of 'istio-discovery'
        description: 'Release istio-discovery Helm Chart'
        # Default value if no value is explicitly provided
        default: 'No'
        # Input has to be provided for the workflow to run
        required: true
        options:
        - 'Yes'
        - 'No'
      kubeslice-controller:
        type: choice
        # Friendly description to be shown in the UI instead of 'kubeslice-controller'
        description: 'Release kubeslice-controller Helm Chart'
        # Default value if no value is explicitly provided
        default: 'No'
        # Input has to be provided for the workflow to run
        required: true
        options:
        - 'Yes'
        - 'No'
      kubeslice-worker:
        type: choice
        # Friendly description to be shown in the UI instead of 'kubeslice-worker'
        description: 'Release kubeslice-worker Helm Chart'
        # Default value if no value is explicitly provided
        default: 'No'
        # Input has to be provided for the workflow to run
        required: true
        options:
        - 'Yes'
        - 'No'
      botkube:
        type: choice
        # Friendly description to be shown in the UI instead of 'kubeslice-worker'
        description: 'Release botkube Helm Chart'
        # Default value if no value is explicitly provided
        default: 'No'
        # Input has to be provided for the workflow to run
        required: true
        options:
        - 'Yes'
        - 'No'
      prometheus:
        type: choice
        # Friendly description to be shown in the UI instead of 'kubeslice-worker'
        description: 'Release prometheus Helm Chart'
        # Default value if no value is explicitly provided
        default: 'No'
        # Input has to be provided for the workflow to run
        required: true
        options:
        - 'Yes'
        - 'No'
        
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Fetch history
        run: git fetch --prune --tags

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.8.1

      - name: Set CR_TOKEN
        id: set-token
        run: |
          if [ -n "${{ secrets.TOKEN }}" ]; then
            echo "token=${{ secrets.TOKEN }}" >> $GITHUB_OUTPUT
          else
            echo "token=${{ github.token }}" >> $GITHUB_OUTPUT
          fi

      - name: Install chart-releaser
        run: |
          curl -sSLo cr.tar.gz "https://github.com/helm/chart-releaser/releases/download/v1.7.0/chart-releaser_1.7.0_linux_amd64.tar.gz"
          tar -xzf cr.tar.gz
          sudo mv cr /usr/local/bin/cr
          chmod +x /usr/local/bin/cr
          
      - name: Run chart-releaser
        if: ${{ github.event.inputs.cert-manager == 'Yes' || github.event.inputs.istio-base == 'Yes' || github.event.inputs.istio-discovery == 'Yes' || github.event.inputs.kubeslice-controller == 'Yes' || github.event.inputs.kubeslice-worker == 'Yes' || github.event.inputs.prometheus == 'Yes' || github.event.inputs.botkube == 'Yes' }}
        run: |
          export CR_TOKEN="${{ steps.set-token.outputs.token }}"
          export OWNER=$(cut -d '/' -f 1 <<< "$GITHUB_REPOSITORY")
          export REPO=$(cut -d '/' -f 2 <<< "$GITHUB_REPOSITORY")
          
          # Package all charts (find each chart directory and package it)
          echo "Packaging charts..."
          mkdir -p .cr-release-packages
          for chart_dir in charts/*/; do
            if [ -f "$chart_dir/Chart.yaml" ]; then
              echo "Packaging chart: $chart_dir"
              cr package "$chart_dir"
            fi
          done
          
          # Upload with skip-existing flag to avoid errors on existing releases
          if [ -d .cr-release-packages ] && [ "$(ls -A .cr-release-packages/*.tgz 2>/dev/null)" ]; then
            echo "Uploading chart packages (skipping existing releases)..."
            cr upload --skip-existing --owner "$OWNER" --git-repo "$REPO" --token "$CR_TOKEN"
            
            # Update index and push
            echo "Updating index..."
            cr index --owner "$OWNER" --git-repo "$REPO" --push --token "$CR_TOKEN"
          else
            echo "No chart packages to upload"
          fi
        env:
          CR_TOKEN: "${{ steps.set-token.outputs.token }}"
